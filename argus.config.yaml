# Argus global configuration
# Copy to argus.config.local.yaml and customize for your environment.
#
# Environment variables (read by the CLI / server, not as YAML keys here):
#   CURSOR_API_KEY   — Cursor Cloud Agents API key (overrides apiKeyPath below)
#   GITHUB_TOKEN     — GitHub PAT with repo scope; required for `argus cleanup`
#   OPENAI_API_KEY   — optional; enables LLM-assisted validation scoring

# --- Target repository ---
repository: "https://github.com/synaptic-ai-consulting/argus-demo.git"
defaultRef: main

# --- Cursor Cloud Agents ---
apiKeyPath: ~/.cursor/argus-api-key
maxAgents: 5

# --- Optional: path to a file containing an OpenAI API key (UI settings may write this) ---
# openaiApiKeyPath: ~/.config/argus/openai-api-key

# --- Optional webhook (if unset, `argus run` and UI job creation start an embedded tunnel) ---
# webhookUrl: ""
# webhookSecret: "" # min 32 characters for HMAC verification
