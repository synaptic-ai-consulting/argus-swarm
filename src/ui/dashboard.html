<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Argus — Oversight Dashboard</title>
<style>
:root {
  --bg: #0e1117;
  --surface: #161b22;
  --surface2: #1c2230;
  --border: #2a3140;
  --text: #d1d5db;
  --text-dim: #6b7280;
  --text-bright: #f0f4f8;
  --accent: #38bdf8;
  --green: #22c55e;
  --amber: #f59e0b;
  --red: #ef4444;
  --blue: #3b82f6;
  --gray: #4b5563;
  --font-mono: "JetBrains Mono", "Fira Code", "Cascadia Code", monospace;
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
  --radius: 6px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ─────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.logo {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 2px;
}

.logo span { color: var(--text-dim); font-weight: 400; font-size: 12px; letter-spacing: 0; margin-left: 8px; }

.status-pills {
  display: flex;
  gap: 8px;
}

.pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--border);
}

.pill .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.pill-running .dot { background: var(--blue); }
.pill-finished .dot { background: var(--green); }
.pill-error .dot { background: var(--red); }
.pill-exceptions .dot { background: var(--amber); }

/* ── Metrics Strip ──────────────────────────────── */
.metrics-strip {
  display: flex;
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}

.metric-tile {
  flex: 1;
  background: var(--surface);
  padding: 14px 16px;
  text-align: center;
  min-width: 0;
}

.metric-tile.dimmed { opacity: 0.35; }

.metric-value {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
  line-height: 1.2;
}

.metric-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
  margin-top: 2px;
}

.metric-target {
  font-size: 10px;
  margin-top: 4px;
  font-family: var(--font-mono);
}

.target-ok { color: var(--green); }
.target-warn { color: var(--amber); }
.target-na { color: var(--text-dim); }

/* ── Main Layout ────────────────────────────────── */
.main {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 1px;
  background: var(--border);
  min-height: calc(100vh - 180px);
}

@media (max-width: 860px) {
  .main { grid-template-columns: 1fr; }
}

.panel {
  background: var(--surface);
  overflow-y: auto;
}

.panel-header {
  padding: 14px 16px 10px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 2;
}

/* ── Swarm Grid ─────────────────────────────────── */
.swarm-section { padding: 12px 16px; }
.swarm-section + .swarm-section { border-top: 1px solid var(--border); }

.swarm-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 12px;
}

.swarm-status-row .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.swarm-status-row .count {
  font-family: var(--font-mono);
  font-weight: 600;
  margin-left: auto;
  color: var(--text-bright);
}

.agent-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 8px 0;
}

.agent-dot {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  position: relative;
  border: 2px solid transparent;
}

.agent-dot:hover {
  transform: scale(1.6);
  z-index: 10;
  box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
}

.agent-dot[data-status="RUNNING"] { background: var(--blue); }
.agent-dot[data-status="FINISHED"] { background: var(--green); }
.agent-dot[data-status="ERROR"] { background: var(--red); }
.agent-dot[data-status="STOPPED"] { background: var(--amber); }
.agent-dot[data-status="CREATING"] { background: var(--gray); }

.agent-dot.trust-high { border-color: rgba(34, 197, 94, 0.6); }
.agent-dot.trust-low { border-color: rgba(239, 68, 68, 0.5); border-style: dashed; }

/* ── Trust Distribution ─────────────────────────── */
.trust-bars {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 4px 0;
}

.trust-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}

.trust-row .label { width: 60px; color: var(--text-dim); }
.trust-row .count { width: 28px; font-family: var(--font-mono); font-weight: 600; text-align: right; color: var(--text-bright); }

.trust-bar-track {
  flex: 1;
  height: 8px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}

.trust-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

.trust-bar-fill.high { background: var(--green); }
.trust-bar-fill.med { background: var(--amber); }
.trust-bar-fill.low { background: var(--red); }

/* ── Exception Queue ────────────────────────────── */
.exception-list { padding: 8px; }
.exception-list:empty::after {
  content: "No pending exceptions";
  display: block;
  text-align: center;
  padding: 40px 16px;
  color: var(--text-dim);
  font-size: 13px;
}

.exc-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 8px;
  border-left: 3px solid var(--gray);
  overflow: hidden;
}

.exc-card[data-decision="blocked"] { border-left-color: var(--red); }
.exc-card[data-decision="escalate"] { border-left-color: var(--amber); }
.exc-card[data-decision="block"] { border-left-color: var(--red); }

.exc-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  cursor: pointer;
}

.exc-badge {
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: 3px;
  flex-shrink: 0;
}

.exc-badge.blocked { background: rgba(239, 68, 68, 0.2); color: var(--red); }
.exc-badge.escalate { background: rgba(245, 158, 11, 0.2); color: var(--amber); }
.exc-badge.block { background: rgba(239, 68, 68, 0.15); color: #f87171; }
.exc-badge.auto_approve { background: rgba(34, 197, 94, 0.2); color: var(--green); }
.exc-badge.resolved { background: rgba(107, 114, 128, 0.2); color: var(--text-dim); }

.exc-name {
  font-weight: 600;
  color: var(--text-bright);
  font-size: 13px;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.exc-confidence {
  width: 60px;
  flex-shrink: 0;
}

.conf-bar-track {
  width: 100%;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.conf-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}

.conf-label {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  text-align: right;
  margin-top: 1px;
}

.exc-body {
  padding: 0 12px 10px;
  display: none;
}

.exc-card.open .exc-body { display: block; }

.exc-checks {
  list-style: none;
  margin-bottom: 10px;
}

.exc-checks li {
  font-size: 12px;
  padding: 3px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}

.check-icon {
  width: 14px;
  text-align: center;
  flex-shrink: 0;
  font-size: 11px;
}

.check-pass { color: var(--green); }
.check-fail { color: var(--red); }

.exc-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.exc-meta a { color: var(--accent); text-decoration: none; }
.exc-meta a:hover { text-decoration: underline; }

.exc-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btn {
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.btn:hover { background: var(--surface2); border-color: var(--accent); }
.btn-approve { color: var(--green); }
.btn-approve:hover { border-color: var(--green); }
.btn-reject { color: var(--red); }
.btn-reject:hover { border-color: var(--red); }
.btn-followup { color: var(--accent); }

.followup-input {
  display: none;
  margin-top: 8px;
}

.followup-input.open { display: flex; gap: 6px; }

.followup-input input {
  flex: 1;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px 10px;
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 12px;
  outline: none;
}

.followup-input input:focus { border-color: var(--accent); }

.exc-resolved-section {
  border-top: 1px solid var(--border);
  margin-top: 8px;
}

.exc-resolved-toggle {
  display: block;
  width: 100%;
  background: none;
  border: none;
  padding: 10px 12px;
  color: var(--text-dim);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  cursor: pointer;
  text-align: left;
}

.exc-resolved-toggle:hover { color: var(--text); }

.exc-resolved-list {
  display: none;
}

.exc-resolved-list.open { display: block; }

.exc-card.resolved-card {
  opacity: 0.5;
  border-left-color: var(--gray);
}

/* ── Activity Feed ──────────────────────────────── */
.activity-feed {
  background: var(--surface);
  border-top: 1px solid var(--border);
  max-height: 200px;
  overflow-y: auto;
}

.activity-feed .panel-header { position: sticky; top: 0; }

.feed-list { padding: 4px 16px 8px; }

.feed-item {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 4px 0;
  font-size: 12px;
  border-bottom: 1px solid rgba(42, 49, 64, 0.5);
}

.feed-item:last-child { border-bottom: none; }

.feed-time {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-dim);
  flex-shrink: 0;
  width: 56px;
}

.feed-agent {
  font-weight: 600;
  color: var(--text-bright);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex-shrink: 0;
}

.feed-event { color: var(--text-dim); flex: 1; }
.feed-event .tag-approve { color: var(--green); }
.feed-event .tag-escalate { color: var(--amber); }
.feed-event .tag-block { color: var(--red); }
.feed-event .tag-blocked { color: var(--red); }

/* ── Agent Popover ──────────────────────────────── */
.popover-overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
}

.popover-overlay.open { display: block; }

.popover {
  position: fixed;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  width: 320px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  z-index: 101;
  font-size: 13px;
}

.popover h3 {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.popover-row {
  display: flex;
  justify-content: space-between;
  padding: 3px 0;
}

.popover-row .label { color: var(--text-dim); font-size: 12px; }
.popover-row .value { font-family: var(--font-mono); font-size: 12px; color: var(--text-bright); text-align: right; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.popover-row .value a { color: var(--accent); text-decoration: none; }

.popover-summary {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text);
  max-height: 100px;
  overflow-y: auto;
  line-height: 1.5;
}

/* ── Spinner ────────────────────────────────────── */
.loading-msg {
  text-align: center;
  padding: 48px;
  color: var(--text-dim);
  font-size: 13px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">ARGUS<span>Adaptive Stigmergic Oversight</span></div>
  </div>
  <div class="status-pills" id="statusPills">
    <div class="pill pill-running"><div class="dot"></div><span id="pillRunning">0</span> Running</div>
    <div class="pill pill-finished"><div class="dot"></div><span id="pillFinished">0</span> Done</div>
    <div class="pill pill-error"><div class="dot"></div><span id="pillError">0</span> Error</div>
    <div class="pill pill-exceptions"><div class="dot"></div><span id="pillExceptions">0</span> Exceptions</div>
  </div>
</div>

<div class="metrics-strip" id="metricsStrip"></div>

<div class="main">
  <div class="panel" id="leftPanel">
    <div class="panel-header">Agent Swarm</div>
    <div id="swarmContent"><div class="loading-msg">Loading agents...</div></div>
  </div>
  <div class="panel" id="rightPanel">
    <div class="panel-header">Exception Review Queue</div>
    <div id="exceptionContent"><div class="loading-msg">Loading exceptions...</div></div>
  </div>
</div>

<div class="activity-feed">
  <div class="panel-header">Activity Feed</div>
  <div class="feed-list" id="feedList"><div class="loading-msg" style="padding:16px">Loading...</div></div>
</div>

<div class="popover-overlay" id="popoverOverlay"></div>
<div class="popover" id="popover" style="display:none"></div>

<script>
(function() {
  let agents = [];
  let exceptions = [];
  let metrics = {};
  let resolvedVisible = false;

  // ── Data fetching ────────────────────────────
  async function fetchAll() {
    try {
      const [ag, ex, met] = await Promise.all([
        fetch("/api/agents").then(r => r.json()),
        fetch("/api/exceptions?all=1").then(r => r.json()),
        fetch("/api/metrics").then(r => r.json()),
      ]);
      agents = ag;
      exceptions = ex;
      metrics = met;
      render();
    } catch (e) {
      console.error("Fetch error:", e);
    }
  }

  // ── Render orchestrator ──────────────────────
  function render() {
    renderPills();
    renderMetrics();
    renderSwarm();
    renderExceptions();
    renderFeed();
  }

  // ── Header pills ────────────────────────────
  function renderPills() {
    const sc = metrics.statusCounts || {};
    document.getElementById("pillRunning").textContent = sc.running || 0;
    document.getElementById("pillFinished").textContent = sc.finished || 0;
    document.getElementById("pillError").textContent = sc.error || 0;
    const pending = exceptions.filter(e => !e.resolved);
    document.getElementById("pillExceptions").textContent = pending.length;
  }

  // ── Metrics strip ───────────────────────────
  function renderMetrics() {
    const m = metrics;
    const pe = m.exceptionRate || 0;
    const tiles = [
      {
        label: "Effective Fan-Out",
        value: m.effectiveFanOut != null ? m.effectiveFanOut.toFixed(1) : "—",
        target: "Eq. 2: N(1 - Pe·Tr/Tc)",
        cls: "target-ok",
      },
      {
        label: "Exception Rate",
        value: (pe * 100).toFixed(1) + "%",
        target: pe <= 0.1 ? "< 10% ✓" : "> 10% ⚠",
        cls: pe <= 0.1 ? "target-ok" : "target-warn",
      },
      {
        label: "Throughput / hr",
        value: m.throughputPerHour != null ? String(m.throughputPerHour) : "—",
        target: "FINISHED in last 1h",
        cls: "target-ok",
      },
      {
        label: "Trust Mean",
        value: m.trustMean != null ? m.trustMean.toFixed(2) : "—",
        target: m.trustMean != null ? (m.trustMean >= 0.7 ? "Healthy" : "Low") : "",
        cls: m.trustMean != null ? (m.trustMean >= 0.7 ? "target-ok" : "target-warn") : "target-na",
      },
      {
        label: "Containment",
        value: m.containmentRatio != null ? (m.containmentRatio * 100).toFixed(0) + "%" : "—",
        target: "Auto-approved / total",
        cls: m.containmentRatio >= 0.9 ? "target-ok" : "target-warn",
      },
      { label: "Coord. Cost", value: "N/A", target: "Not yet instrumented", cls: "target-na", dimmed: true },
      { label: "Adapt. Speed", value: "N/A", target: "Not yet instrumented", cls: "target-na", dimmed: true },
      { label: "Intent Fidelity", value: "N/A", target: "Not yet instrumented", cls: "target-na", dimmed: true },
    ];
    document.getElementById("metricsStrip").innerHTML = tiles.map(t =>
      '<div class="metric-tile' + (t.dimmed ? ' dimmed' : '') + '">' +
        '<div class="metric-value">' + t.value + '</div>' +
        '<div class="metric-label">' + t.label + '</div>' +
        '<div class="metric-target ' + t.cls + '">' + t.target + '</div>' +
      '</div>'
    ).join("");
  }

  // ── Swarm grid ──────────────────────────────
  function renderSwarm() {
    const sc = metrics.statusCounts || {};
    const statusOrder = [
      { key: "RUNNING", label: "Running", count: sc.running || 0, color: "var(--blue)" },
      { key: "FINISHED", label: "Finished", count: sc.finished || 0, color: "var(--green)" },
      { key: "ERROR", label: "Error", count: sc.error || 0, color: "var(--red)" },
      { key: "STOPPED", label: "Blocked", count: sc.blocked || 0, color: "var(--amber)" },
      { key: "CREATING", label: "Creating", count: sc.creating || 0, color: "var(--gray)" },
    ];

    const statusRows = statusOrder.map(s =>
      '<div class="swarm-status-row">' +
        '<div class="dot" style="background:' + s.color + '"></div>' +
        '<span>' + s.label + '</span>' +
        '<span class="count">' + s.count + '</span>' +
      '</div>'
    ).join("");

    const dots = agents.map(a => {
      let trustCls = "";
      if (a.trust != null) {
        trustCls = a.trust >= 0.85 ? " trust-high" : a.trust < 0.6 ? " trust-low" : "";
      }
      const title = (a.name || a.id.slice(0, 8)) + " [" + a.status + "]" + (a.trust != null ? " τ=" + a.trust.toFixed(2) : "") + " " + elapsed(a.createdAt);
      return '<div class="agent-dot' + trustCls + '" data-status="' + a.status + '" data-id="' + a.id + '" title="' + esc(title) + '"></div>';
    }).join("");

    // Trust distribution
    let trustHigh = 0, trustMed = 0, trustLow = 0, trustNone = 0;
    agents.forEach(a => {
      if (a.trust == null) trustNone++;
      else if (a.trust >= 0.85) trustHigh++;
      else if (a.trust >= 0.6) trustMed++;
      else trustLow++;
    });
    const total = agents.length || 1;

    const trustSection =
      '<div class="trust-bars">' +
        trustBar("High (≥.85)", trustHigh, total, "high") +
        trustBar("Med (.6–.85)", trustMed, total, "med") +
        trustBar("Low (<.6)", trustLow, total, "low") +
      '</div>';

    document.getElementById("swarmContent").innerHTML =
      '<div class="swarm-section">' + statusRows + '</div>' +
      '<div class="swarm-section"><div class="agent-grid">' + dots + '</div></div>' +
      '<div class="swarm-section"><div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim);margin-bottom:6px">Trust Distribution</div>' + trustSection + '</div>';

    document.querySelectorAll(".agent-dot").forEach(el => {
      el.addEventListener("click", e => showPopover(el.dataset.id, e));
    });
  }

  function trustBar(label, count, total, cls) {
    const pct = total > 0 ? (count / total * 100) : 0;
    return '<div class="trust-row">' +
      '<span class="label">' + label + '</span>' +
      '<div class="trust-bar-track"><div class="trust-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>' +
      '<span class="count">' + count + '</span>' +
    '</div>';
  }

  // ── Exception queue ─────────────────────────
  function renderExceptions() {
    const pending = exceptions.filter(e => !e.resolved);
    const resolved = exceptions.filter(e => e.resolved);

    const severityOrder = { blocked: 0, block: 1, escalate: 2 };
    pending.sort((a, b) => (severityOrder[a.decision] ?? 9) - (severityOrder[b.decision] ?? 9));

    let html = '<div class="exception-list">';
    html += pending.map(e => excCard(e, false)).join("");
    html += '</div>';

    if (resolved.length > 0) {
      html += '<div class="exc-resolved-section">' +
        '<button class="exc-resolved-toggle" id="resolvedToggle">' +
          'Resolved (' + resolved.length + ')' +
        '</button>' +
        '<div class="exc-resolved-list' + (resolvedVisible ? ' open' : '') + '" id="resolvedList">' +
          '<div class="exception-list">' +
            resolved.map(e => excCard(e, true)).join("") +
          '</div>' +
        '</div>' +
      '</div>';
    }

    document.getElementById("exceptionContent").innerHTML = html;

    document.querySelectorAll(".exc-header").forEach(el => {
      el.addEventListener("click", () => {
        el.closest(".exc-card").classList.toggle("open");
      });
    });

    document.querySelectorAll(".btn-approve").forEach(el => {
      el.addEventListener("click", e => { e.stopPropagation(); doReview(el.dataset.id, "approve"); });
    });

    document.querySelectorAll(".btn-reject").forEach(el => {
      el.addEventListener("click", e => { e.stopPropagation(); doReview(el.dataset.id, "reject"); });
    });

    document.querySelectorAll(".btn-followup").forEach(el => {
      el.addEventListener("click", e => {
        e.stopPropagation();
        const inp = el.closest(".exc-body").querySelector(".followup-input");
        inp.classList.toggle("open");
        if (inp.classList.contains("open")) inp.querySelector("input").focus();
      });
    });

    document.querySelectorAll(".followup-send").forEach(el => {
      el.addEventListener("click", () => {
        const wrap = el.closest(".followup-input");
        const msg = wrap.querySelector("input").value.trim();
        if (msg) doFollowup(el.dataset.id, msg);
      });
    });

    const toggle = document.getElementById("resolvedToggle");
    if (toggle) {
      toggle.addEventListener("click", () => {
        resolvedVisible = !resolvedVisible;
        document.getElementById("resolvedList").classList.toggle("open", resolvedVisible);
      });
    }
  }

  function excCard(e, isResolved) {
    const agent = agents.find(a => a.id === e.agentId);
    const name = agent?.name || e.agentId.slice(0, 12);
    const decision = e.decision || "escalate";
    const conf = e.confidence ?? 0;
    const confPct = (conf * 100).toFixed(0);
    const confColor = conf >= 0.85 ? "var(--green)" : conf >= 0.6 ? "var(--amber)" : "var(--red)";

    const checks = (e.checks || []).map(c =>
      '<li><span class="check-icon ' + (c.passed ? "check-pass" : "check-fail") + '">' + (c.passed ? "✓" : "✗") + '</span>' +
      '<span>' + esc(c.name) + (c.output ? ': ' + esc(String(c.output).slice(0, 80)) : '') + '</span></li>'
    ).join("");

    const badgeCls = isResolved ? "resolved" : decision;
    const badgeText = isResolved ? e.resolved : decision;

    let meta = '';
    if (e.branchName) meta += 'Branch: ' + esc(e.branchName) + '<br>';
    if (e.prUrl) meta += 'PR: <a href="' + esc(e.prUrl) + '" target="_blank">' + esc(e.prUrl) + '</a><br>';
    meta += 'Created: ' + elapsed(e.createdAt);

    const actions = isResolved ? '' :
      '<div class="exc-actions">' +
        '<button class="btn btn-approve" data-id="' + e.id + '">Approve</button>' +
        '<button class="btn btn-reject" data-id="' + e.id + '">Reject</button>' +
        (decision === "blocked" ? '<button class="btn btn-followup" data-id="' + e.id + '">Follow-up</button>' : '') +
      '</div>' +
      '<div class="followup-input" data-id="' + e.id + '">' +
        '<input type="text" placeholder="Send guidance to agent...">' +
        '<button class="btn followup-send" data-id="' + e.id + '">Send</button>' +
      '</div>';

    return '<div class="exc-card' + (isResolved ? ' resolved-card' : '') + '" data-decision="' + decision + '">' +
      '<div class="exc-header">' +
        '<span class="exc-badge ' + badgeCls + '">' + badgeText + '</span>' +
        '<span class="exc-name">' + esc(name) + '</span>' +
        '<div class="exc-confidence">' +
          '<div class="conf-bar-track"><div class="conf-bar-fill" style="width:' + confPct + '%;background:' + confColor + '"></div></div>' +
          '<div class="conf-label">' + confPct + '%</div>' +
        '</div>' +
      '</div>' +
      '<div class="exc-body">' +
        '<ul class="exc-checks">' + checks + '</ul>' +
        '<div class="exc-meta">' + meta + '</div>' +
        actions +
      '</div>' +
    '</div>';
  }

  // ── Activity feed ───────────────────────────
  function renderFeed() {
    const events = [];

    exceptions.forEach(e => {
      const agent = agents.find(a => a.id === e.agentId);
      const name = agent?.name || e.agentId.slice(0, 12);
      events.push({ time: e.createdAt, agent: name, text: 'Exception <span class="tag-' + (e.decision || 'escalate') + '">[' + (e.decision || 'escalate') + ']</span> confidence=' + (e.confidence ?? 0).toFixed(2) });
      if (e.resolved) {
        events.push({ time: e.createdAt, agent: name, text: 'Resolved → <span class="tag-approve">' + e.resolved + '</span>' });
      }
    });

    agents.forEach(a => {
      if (a.status === "FINISHED") {
        const name = a.name || a.id.slice(0, 12);
        events.push({ time: a.createdAt, agent: name, text: 'FINISHED' + (a.trust != null ? ' → <span class="tag-approve">auto_approved</span> (τ=' + a.trust.toFixed(2) + ')' : '') });
      }
    });

    events.sort((a, b) => new Date(b.time).getTime() - new Date(a.time).getTime());
    const recent = events.slice(0, 25);

    if (recent.length === 0) {
      document.getElementById("feedList").innerHTML = '<div class="loading-msg" style="padding:16px">No activity yet</div>';
      return;
    }

    document.getElementById("feedList").innerHTML = recent.map(ev =>
      '<div class="feed-item">' +
        '<span class="feed-time">' + formatTime(ev.time) + '</span>' +
        '<span class="feed-agent">' + esc(ev.agent) + '</span>' +
        '<span class="feed-event">' + ev.text + '</span>' +
      '</div>'
    ).join("");
  }

  // ── Agent popover ───────────────────────────
  function showPopover(agentId, event) {
    const a = agents.find(x => x.id === agentId);
    if (!a) return;

    const pop = document.getElementById("popover");
    const overlay = document.getElementById("popoverOverlay");

    const statusColor = { RUNNING: "var(--blue)", FINISHED: "var(--green)", ERROR: "var(--red)", STOPPED: "var(--amber)", CREATING: "var(--gray)" };

    let html = '<h3><div class="dot" style="width:10px;height:10px;border-radius:50%;background:' + (statusColor[a.status] || "var(--gray)") + '"></div>' + esc(a.name || a.id.slice(0, 12)) + '</h3>';
    html += row("Status", a.status);
    html += row("ID", a.id.slice(0, 16) + "...");
    if (a.branch) html += row("Branch", a.branch);
    if (a.prUrl) html += '<div class="popover-row"><span class="label">PR</span><span class="value"><a href="' + esc(a.prUrl) + '" target="_blank">View PR</a></span></div>';
    if (a.trust != null) html += row("Trust (τ)", a.trust.toFixed(3));
    html += row("Elapsed", elapsed(a.createdAt));
    if (a.intent) html += row("Intent", a.intent.length > 60 ? a.intent.slice(0, 60) + "..." : a.intent);
    if (a.summary) html += '<div class="popover-summary">' + esc(a.summary) + '</div>';

    pop.innerHTML = html;
    pop.style.display = "block";
    overlay.classList.add("open");

    const rect = event.target.getBoundingClientRect();
    const pw = 320;
    let left = rect.right + 8;
    let top = rect.top - 20;
    if (left + pw > window.innerWidth) left = rect.left - pw - 8;
    if (top + 300 > window.innerHeight) top = window.innerHeight - 310;
    if (top < 8) top = 8;
    pop.style.left = left + "px";
    pop.style.top = top + "px";

    function closePopover() {
      pop.style.display = "none";
      overlay.classList.remove("open");
      overlay.removeEventListener("click", closePopover);
    }
    overlay.addEventListener("click", closePopover);
  }

  function row(label, value) {
    return '<div class="popover-row"><span class="label">' + label + '</span><span class="value">' + esc(String(value)) + '</span></div>';
  }

  // ── Actions ─────────────────────────────────
  async function doReview(excId, action) {
    await fetch("/api/review/" + action + "/" + excId, { headers: { Accept: "application/json" } });
    fetchAll();
  }

  async function doFollowup(excId, message) {
    try {
      await fetch("/api/review/followup/" + excId, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      fetchAll();
    } catch (e) {
      alert("Follow-up failed: " + e.message);
    }
  }

  // ── Helpers ─────────────────────────────────
  function esc(s) {
    if (!s) return "";
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function elapsed(iso) {
    if (!iso) return "";
    const ms = Date.now() - new Date(iso).getTime();
    if (ms < 60000) return Math.floor(ms / 1000) + "s ago";
    if (ms < 3600000) return Math.floor(ms / 60000) + "m ago";
    if (ms < 86400000) return Math.floor(ms / 3600000) + "h ago";
    return Math.floor(ms / 86400000) + "d ago";
  }

  function formatTime(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ── Init ────────────────────────────────────
  fetchAll();
  setInterval(fetchAll, 5000);
})();
</script>
</body>
